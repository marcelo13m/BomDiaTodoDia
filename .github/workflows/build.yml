name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Extrair o projeto do ZIP
        run: unzip -q BomDiaTodoDia.zip

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Rodar testes unitários
        working-directory: BomDiaTodoDia
        run: gradle testDebugUnitTest --console=plain

      - name: Compilar APK de depuração
        working-directory: BomDiaTodoDia
        run: gradle assembleDebug --console=plain

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: BomDiaTodoDia-APK
          path: BomDiaTodoDia/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Aviso de onde baixar
        run: |
          echo "## APK pronto" >> "$GITHUB_STEP_SUMMARY"
          echo "Role esta página até a seção **Artifacts** e baixe **BomDiaTodoDia-APK**." >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar relatórios de erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registros-de-erro
          path: |
            BomDiaTodoDia/app/build/reports
            BomDiaTodoDia/app/build/test-results
          if-no-files-found: ignore
